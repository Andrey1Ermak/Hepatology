name: Daily autonomous run

# Runs every day on a GitHub-hosted Mac, independent of the author's computer.
# 11:00 UTC = 07:00 New York (summer) / 06:00 (winter). GitHub may start
# scheduled jobs a few minutes late.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal or dry-run"
        default: normal
        type: choice
        options: [normal, dry-run]

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      TZ: America/New_York
      # Every model call in the run — main session and subagents — is Claude Opus 5.5.
      HEP_MODEL: claude-opus-5-5
      ANTHROPIC_MODEL: claude-opus-5-5
      CLAUDE_CODE_SUBAGENT_MODEL: claude-opus-5-5
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install xcodegen and poppler
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen poppler

      - name: Install python-pptx
        run: python3 -m pip install --quiet --user --break-system-packages python-pptx && python3 -c "import pptx; print('python-pptx', pptx.__version__)"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Git identity
        run: |
          git config user.name "HepReference Team"
          git config user.email "hepreference-bot@users.noreply.github.com"

      - name: Check Claude access
        shell: bash
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error title=Missing secret::CLAUDE_CODE_OAUTH_TOKEN is not set in repository secrets"
            exit 1
          fi
          OUT="$(claude -p "Reply with exactly: OK" --model "$HEP_MODEL" 2>&1 || true)"
          if ! grep -q "OK" <<<"$OUT"; then
            echo "::error title=Claude auth failed::$(tail -3 <<<"$OUT" | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          echo "::notice title=Claude access::OK ($HEP_MODEL)"

      - name: Team run
        shell: bash
        run: |
          set +e -o pipefail
          MODE="${{ inputs.mode || 'normal' }}"
          PROMPT="$(cat automation/DAILY_RUN.md)"
          if [ "$MODE" = "dry-run" ]; then
            PROMPT+=$'\n\n---\n**DRY RUN.** Выполни только фазы 1 и 2. Ничего не меняй: никаких правок файлов, коммитов, push и --done у синхронизации. В конце выведи план дня в формате фазы 2.'
          fi
          PROMPT+=$'\n\n---\n**Окружение:** облачный Mac GitHub Actions (одноразовый). Тесты — `tools/test.sh`, снимки — `tools/screenshot.sh`. Перед push всегда `git pull --rebase origin main`. Push в origin работает через токен Actions.'
          START=$(date +%s)
          claude -p "$PROMPT" --model "$HEP_MODEL" --dangerously-skip-permissions --output-format text 2>&1 | tee run.log
          STATUS=$?
          MIN=$(( ($(date +%s) - START) / 60 ))
          SUMMARY="$(tail -c 700 run.log | tr '\n' ' ')"
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Team run failed (exit $STATUS, ${MIN} min)::$SUMMARY"
            exit $STATUS
          fi
          if [ "$MODE" = "normal" ]; then
            git fetch -q origin
            if [ ! -f "reports/$(date +%Y-%m-%d).md" ] && ! git show "origin/main:reports/$(date +%Y-%m-%d).md" >/dev/null 2>&1; then
              echo "::error title=No daily report::Run finished in ${MIN} min without reports/$(date +%Y-%m-%d).md — $SUMMARY"
              exit 1
            fi
            if [ "$(date +%u)" = "7" ] && ! ls reports/weekly/*W$(date +%V).md >/dev/null 2>&1 && ! git ls-tree -r --name-only origin/main reports/weekly | grep -q "W$(date +%V).md"; then
              echo "::error title=No weekly report::Sunday run finished without reports/weekly/*W$(date +%V).md"
              exit 1
            fi
          fi
          echo "::notice title=Team run ${MODE} (${MIN} min)::$SUMMARY"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}
          path: |
            run.log
            /tmp/hep-test.log
          if-no-files-found: ignore
          retention-days: 30
