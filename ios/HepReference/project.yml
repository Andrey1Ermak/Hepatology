name: HepReference
options:
  bundleIdPrefix: com.hepreference
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "HepReference"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: brandAccent
targets:
  HepReference:
    type: application
    platform: iOS
    sources:
      - path: HepReference/App
      - path: HepReference/Models
      - path: HepReference/Views
      - path: HepReference/Calculators
      - path: HepReference/DesignSystem
      - path: HepReference/Assets.xcassets
      - path: HepReference/Content
        buildPhase: resources
        type: folder
    info:
      path: HepReference/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: "HepReference"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hepreference.app
        GENERATE_INFOPLIST_FILE: NO
  HepReferenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HepReferenceTests
      - path: HepReference/Content
        buildPhase: resources
        type: folder
    dependencies:
      - target: HepReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hepreference.tests
schemes:
  HepReference:
    build:
      targets:
        HepReference: all
        HepReferenceTests: [test]
    test:
      targets:
        - HepReferenceTests
