<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bile secretion</title>
<style>
  html, body { margin: 0; background: #F2F2F7; font-family: "Avenir Next", Avenir, -apple-system, sans-serif; }
  #wrap { max-width: 360px; margin: 16px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  svg { display: block; width: 100%; height: auto; }
  #ctl { max-width: 360px; margin: 0 auto; display: flex; gap: 8px; align-items: center; padding: 0 16px; font-size: 13px; color: #6E6E73; }
  #ctl input { flex: 1; min-width: 0; }
  #ctl button { font: inherit; padding: 4px 12px; border-radius: 9px; border: 1px solid #D1D1D6; background: #fff; }
  body.dark { background: #000; }
  body.render { background: transparent; }
  body.render #wrap { margin: 0; border-radius: 0; box-shadow: none; max-width: none; width: 360px; }
  body.render #ctl { display: none; }
</style>
</head>
<body>
<div id="wrap"><svg id="s" viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ctl"><button id="pp">Pause</button><button id="th">Dark</button><input id="sc" type="range" min="0" max="55" step="0.05" value="0"><span id="tm">0.0</span></div>
<script>
const T = 55;
const FD = "'Avenir Next', Avenir, -apple-system, sans-serif";       // hepKicker / hepTag / hepTitle
const FB = "'Avenir Next', Avenir, -apple-system, sans-serif";       // hepBody / hepTakeaway
// Colors follow CLAUDE.md §12.2 "Clinical Editorial" (ink, navy, blue, muted, surface, rule, crit, urg, ok, gap, onSolid).
// Biology-only hues (bile, cholangiocyte, hepatocyte, vein) are derived to sit quietly next to those tokens.
const THEMES = {
  light: {
    bg:'#FFFFFF', ink:'#1A1A1A', ink2:'#555555', sep:'#D4D7DB', fill2:'#F2F2F2', accent:'#1B355E', blue:'#2E5A88', onSolid:'#FFFFFF',
    jag:'#D97A0B', jagL:'#F9DDB8', jagM:'#EFAE5C', jagT:'#A85A00',
    notch:'#2E5A88', notchL:'#DCE6F1', nicd:'#1B355E', glow:'#5B7FB3',
    enz:'#8A939B', enzT:'#555555', nuc:'#8C1C1C', nucL:'#FAF1F1', nucT:'#8C1C1C', genesOff:'#DCC5C5', maml:'#B5524F', cor:'#8A939B',
    ok:'#1E7A33', bad:'#B22222', bile:'#9DB52A', bileT:'#5A6B0E',
    chol:'#0E7C86', cholD:'#0A5960', hep:'#EFE3C9', hepS:'#BFA36F',
    vein:'#B5525A', veinL:'#F6E0E2', veinT:'#8F3640',
    mem:'#C9C2B4', memIn:'#F7F4EE', sendFill:'#FDF4E8', recvFill:'#EEF3F9',
    chr:'#ECE9E2', chrS:'#8F887C', chrB:'#BDB6A8', mhead:'#D6CDBB', mfill:'#F0EBE0', ghost:'#C4C8CC', track:'#E4E6E9', barBad:'#9FB3CF',
  },
  dark: {
    bg:'#121417', ink:'#ECEEF1', ink2:'#A3A8AE', sep:'#3A4048', fill2:'#1E2227', accent:'#9DB7DE', blue:'#8FB0DA', onSolid:'#121417',
    jag:'#F0A04B', jagL:'#4A3218', jagM:'#9A6420', jagT:'#F0A04B',
    notch:'#8FB0DA', notchL:'#1C2A3F', nicd:'#9DB7DE', glow:'#4E6E9E',
    enz:'#8A939B', enzT:'#A3A8AE', nuc:'#D88A8A', nucL:'#2A1C1E', nucT:'#D88A8A', genesOff:'#4A3436', maml:'#C27373', cor:'#8A939B',
    ok:'#5CB874', bad:'#E06666', bile:'#B5CC3A', bileT:'#C8DD5A',
    chol:'#4FC1CB', cholD:'#8ADDE3', hep:'#3F3627', hepS:'#8C7650',
    vein:'#E07A82', veinL:'#3A2226', veinT:'#F0A3A9',
    mem:'#4E4A43', memIn:'#24221E', sendFill:'#221C15', recvFill:'#18202B',
    chr:'#33302B', chrS:'#7D766A', chrB:'#55504A', mhead:'#57503F', mfill:'#2C2924', ghost:'#4A5058', track:'#2A2F36', barBad:'#3C5272',
  }
};
let C = THEMES.light;

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const E = (t, a, b) => ease(lin(t, a, b));
const L = (a, b, p) => a + (b - a) * p;
const env = (t, a, b, f = .35) => Math.min(E(t, a, a + f), 1 - E(t, b - f, b));
const r2 = n => Math.round(n * 100) / 100;
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(L(v, B[i], p)).toString(16).padStart(2, '0')).join(''); };
const I = s => `<tspan font-style="italic">${s}</tspan>`;

function tx(x, y, s, o = {}) {
  const { size = 12, fill = C.ink, anchor = 'start', weight = 400, op = 1, italic = false, ls = 0, d = false, filter = '' } = o;
  if (op <= 0.002) return '';
  return `<text x="${r2(x)}" y="${r2(y)}" font-family="${d ? FD : FB}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}" opacity="${r2(op)}"${italic ? ' font-style="italic"' : ''}${ls ? ` letter-spacing="${ls}"` : ''}${filter ? ` filter="url(#${filter})"` : ''}>${s}</text>`;
}
const G = (op, inner, extra = '') => op <= 0.002 ? '' : `<g opacity="${r2(op)}" ${extra}>${inner}</g>`;
const check = (x, y, s, c, w = 2.5) => `<path d="M${x - s * .5},${y} l${s * .35},${s * .38} l${s * .65},-${s * .8}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const cross = (x, y, s, c, w = 2.5) => { const h = s / 2; return `<path d="M${x - h},${y - h} L${x + h},${y + h} M${x + h},${y - h} L${x - h},${y + h}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; };
function arrow(x1, y1, x2, y2, c, w = 2) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 7;
  const p1 = [x2 - h * Math.cos(a - .5), y2 - h * Math.sin(a - .5)], p2 = [x2 - h * Math.cos(a + .5), y2 - h * Math.sin(a + .5)];
  return `<line x1="${x1}" y1="${y1}" x2="${r2(x2 - 4 * Math.cos(a))}" y2="${r2(y2 - 4 * Math.sin(a))}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${r2(p1[0])},${r2(p1[1])} ${r2(p2[0])},${r2(p2[1])}" fill="${c}"/>`;
}
function flash(x, y, p) {
  if (p <= 0 || p >= 1) return '';
  let s = '';
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, ra = 5 + 4 * p, rb = 10 + 6 * p; s += `<line x1="${r2(x + ra * Math.cos(a))}" y1="${r2(y + ra * Math.sin(a))}" x2="${r2(x + rb * Math.cos(a))}" y2="${r2(y + rb * Math.sin(a))}" stroke="#FFCC00" stroke-width="2" stroke-linecap="round"/>`; }
  return G(Math.sin(Math.PI * p), s);
}
function scissors(x, y, open, rot, c) {
  const a = open * 22;
  const blade = `<path d="M0,0 C-3.5,-7 -3,-17 0,-24 C3,-17 3.5,-7 0,0Z" fill="${c}"/>`;
  const half = sgn => `<g transform="rotate(${r2(sgn * a)})">${blade}<line x1="0" y1="0" x2="${sgn * 3.5}" y2="5" stroke="${c}" stroke-width="2.4"/><circle cx="${sgn * 5}" cy="9.5" r="4.6" fill="none" stroke="${c}" stroke-width="2.4"/></g>`;
  return `<g transform="translate(${r2(x)},${r2(y)}) rotate(${rot})">${half(-1)}${half(1)}<circle r="2" fill="${C.bg}" stroke="${c}" stroke-width="1.4"/></g>`;
}
function blob(cx, cy, rx, ry, dent) {
  const pts = [], N = 180;
  for (let i = 0; i < N; i++) {
    const a = i / N * 2 * Math.PI; let x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    if (dent && dent.depth) { const s = Math.sin(a) * dent.side; if (s > 0) y -= dent.side * dent.depth * Math.exp(-(((x - dent.x) / dent.w) ** 2)); }
    pts.push(r2(x) + ',' + r2(y));
  }
  return 'M' + pts.join(' L') + 'Z';
}
const block = (x, y, w, h, stripe) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${C.fill2}"/><rect x="${x}" y="${y}" width="${w}" height="10" rx="9" fill="${stripe}"/><rect x="${x}" y="${y + 4}" width="${w}" height="7" fill="${C.fill2}"/>`;
const memb = p => `<path d="${p}" fill="none" stroke="${C.mem}" stroke-width="6"/><path d="${p}" fill="none" stroke="${C.memIn}" stroke-width="2"/>`;
function caption(t, list) {
  let o = '';
  for (const [a, b, s] of list) {
    const e = env(t, a, b, .25); if (e <= 0) continue;
    const lines = s.split('\n');
    let txt = lines.map((l, i) => tx(180, (lines.length === 1 ? 452 : 443) + i * 18, l, { size: 14, anchor: 'middle', weight: 700, italic: true })).join('');
    o += G(e, block(12, 420, 336, 50, C.accent) + txt);
  }
  return o;
}
function pill(cx, y, label, c, op = 1) {
  const w = label.length * 7 + 16;
  return G(op, `<rect x="${r2(cx - w / 2)}" y="${y - 12}" width="${r2(w)}" height="17" rx="8.5" fill="${c}"/>` + tx(cx, y + 0.5, label, { size: 10.5, anchor: 'middle', weight: 700, fill: C.onSolid, d: true, ls: .5 }));
}

/* ============ Extra tokens for bile chemistry (derived from §12.2) ============ */
Object.assign(THEMES.light, {
  ba:'#9DB52A', baS:'#6E8418', na:'#2E5A88', pc:'#D97A0B', cst:'#BFA36F', hepF:'#FBF4E8', cholF:'#E6F1F2',
  canal:'#F3F6E2', film:'#DCE6F1', blood:'#F6E0E2', critT:'#F6D2D2', urg:'#D97A0B', ggt:'#8C1C1C', onBright:'#1A1A1A',
});
Object.assign(THEMES.dark, {
  ba:'#B5CC3A', baS:'#8AA022', na:'#8FB0DA', pc:'#F0A04B', cst:'#8C7650', hepF:'#241E16', cholF:'#152629',
  canal:'#20251A', film:'#1C2A3F', blood:'#3A2226', critT:'#3A1F21', urg:'#F0A04B', ggt:'#D88A8A', onBright:'#121417',
});

/* ============ Glyphs ============ */
const BA = (x, y, o = 1, r = 3.6) => G(o, `<circle cx="${r2(x)}" cy="${r2(y)}" r="${r}" fill="${C.ba}" stroke="${C.baS}" stroke-width=".8"/>`);
const NA = (x, y, o = 1) => G(o, `<circle cx="${r2(x)}" cy="${r2(y)}" r="2.6" fill="${C.na}"/>`);
const PC = (x, y, o = 1, rot = 0) => G(o, `<g transform="translate(${r2(x)},${r2(y)}) rotate(${r2(rot)})"><line x1="-1.3" y1="2" x2="-1.3" y2="9" stroke="${C.pc}" stroke-width="1.2"/><line x1="1.3" y1="2" x2="1.3" y2="9" stroke="${C.pc}" stroke-width="1.2"/><circle r="2.9" fill="${C.pc}"/></g>`);
const CHO = (x, y, o = 1) => G(o, `<rect x="${r2(x - 3)}" y="${r2(y - 1.8)}" width="6" height="3.6" rx="1.5" fill="${C.cst}"/>`);
function micelle(x, y, o = 1, s = 1) {
  let m = `<circle cx="${r2(x)}" cy="${r2(y)}" r="${r2(10.5 * s)}" fill="${C.bg}" fill-opacity=".6" stroke="${C.baS}" stroke-width=".6" stroke-dasharray="2 2"/>`;
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3, px = x + 7 * s * Math.cos(a), py = y + 7 * s * Math.sin(a);
    m += i % 2 ? `<circle cx="${r2(px)}" cy="${r2(py)}" r="${r2(2.4 * s)}" fill="${C.pc}"/>` : `<circle cx="${r2(px)}" cy="${r2(py)}" r="${r2(2.6 * s)}" fill="${C.ba}" stroke="${C.baS}" stroke-width=".6"/>`;
  }
  m += `<rect x="${r2(x - 3 * s)}" y="${r2(y - 1.6 * s)}" width="${r2(6 * s)}" height="${r2(3.2 * s)}" rx="1.4" fill="${C.cst}"/>`;
  return G(o, m);
}
const GGT = (x, y, o = 1, rot = 0) => G(o, `<g transform="translate(${r2(x)},${r2(y)}) rotate(${r2(rot)})"><path d="M0,0 V-6 M0,-6 L-4,-11 M0,-6 L4,-11" stroke="${C.ggt}" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`);
const tp = (x, y, w, h, o = 1, fill) => G(o, `<rect x="${r2(x - w / 2)}" y="${r2(y - h / 2)}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2}" fill="${fill || C.accent}"/>`);
const lab = (x, y, s, o = {}) => tx(x, y, s, Object.assign({ size: 10, weight: 700, fill: C.accent, d: true, ls: .3 }, o));
const kick = (x, y, s, c, o = {}) => tx(x, y, s, Object.assign({ size: 9, weight: 700, fill: c, d: true, ls: 1 }, o));
function pillL(x, y, label, c, txtc, op = 1) {
  const w = label.length * 6.6 + 16;
  return G(op, `<rect x="${r2(x)}" y="${y - 12}" width="${r2(w)}" height="17" rx="8.5" fill="${c}"/>` + tx(x + w / 2, y + 0.5, label, { size: 10, anchor: 'middle', weight: 700, fill: txtc || C.onSolid, d: true, ls: .5 }));
}
function stepChip(t, steps) {
  let o = '';
  steps.forEach(([a, b, n, name]) => {
    const e = env(t, a, b, .2); if (e <= 0) return;
    const w = name.length * 6.6 + 58, x0 = 180 - w / 2;
    o += G(e, `<rect x="${r2(x0)}" y="10" width="${r2(w)}" height="26" rx="13" fill="${C.bg}" stroke="${C.sep}"/><rect x="${r2(x0 + 4)}" y="14" width="30" height="18" rx="9" fill="${C.accent}"/>` +
      tx(x0 + 19, 27, `${n}/5`, { size: 10.5, anchor: 'middle', weight: 700, fill: C.onSolid, d: true }) +
      tx(x0 + 42, 27.5, name, { size: 12.5, weight: 600 }));
  });
  return o;
}
const hm = (s, lo, hi) => lo + (hi - lo) * (((Math.sin(s * 12.9898) * 43758.5453) % 1 + 1) % 1); // deterministic pseudo-random

/* ============ Scene 1 · hepatocyte: uptake → transit → export → micelle (0–20.5) ============ */
function s1(t) {
  let o = '';
  // sinusoid (blood)
  o += `<rect x="-5" y="44" width="370" height="50" fill="${C.blood}"/>`;
  o += kick(16, 58, 'BLOOD · SINUSOID', C.veinT);
  o += BA(236, 55) + tx(243, 58.5, 'bile acid', { size: 9.5, fill: C.ink2 }) + NA(300, 55) + tx(306, 58.5, 'Na⁺', { size: 9.5, fill: C.ink2 });
  for (let i = 0; i < 7; i++) o += BA(((i * 53 + t * 10) % 380) - 10, 78 + (i % 2) * 7);
  for (let i = 0; i < 5; i++) o += NA(((i * 71 + 30 + t * 8) % 380) - 10, 72 + (i % 3) * 8);

  // hepatocyte
  const cell = 'M38,102 H322 Q344,102 344,124 V296 Q344,318 322,318 H38 Q16,318 16,296 V124 Q16,102 38,102Z';
  o += `<path d="${cell}" fill="${C.hepF}"/>` + memb(cell);
  o += kick(332, 122, 'HEPATOCYTE', C.ink2, { anchor: 'end' });
  // canaliculus + neighbour cell
  o += `<rect x="-5" y="322" width="370" height="52" fill="${C.canal}"/>`;
  o += `<rect x="-5" y="378" width="370" height="40" fill="${C.hepF}"/><line x1="-5" y1="378" x2="365" y2="378" stroke="${C.mem}" stroke-width="6"/><line x1="-5" y1="378" x2="365" y2="378" stroke="${C.memIn}" stroke-width="2"/>`;
  o += kick(24, 336, 'BILE CANALICULUS', C.bileT) + arrow(318, 366, 346, 366, C.bileT, 1.6);

  // transporters + nucleus
  o += tp(110, 102, 16, 22) + lab(124, 122, 'NTCP');
  o += `<circle cx="255" cy="178" r="36" fill="${C.nucL}" stroke="${C.nuc}" stroke-width="1.6"/>` + kick(255, 160, 'NUCLEUS', C.nucT, { anchor: 'middle', size: 8.5 });
  const fxr = E(t, 6.2, 6.8) * (1 - E(t, 8.8, 9.4));
  o += `<rect x="235" y="170" width="40" height="17" rx="5" fill="${C.nuc}"${fxr > .05 ? ' filter="url(#glowS)"' : ''}/>` + tx(255, 182.5, 'FXR', { size: 10, anchor: 'middle', weight: 700, fill: C.onSolid, d: true });
  o += G(E(t, 7.2, 7.8), tx(255, 232, '↑ BSEP · ↑ MDR3', { size: 10.5, anchor: 'middle', weight: 700, fill: C.accent, d: true }) + tx(255, 247, '↓ NTCP · ↓ CYP7A1', { size: 10.5, anchor: 'middle', weight: 700, fill: C.accent, d: true }));
  o += tp(120, 318, 22, 16) + lab(134, 306, 'BSEP');
  o += tp(230, 318, 22, 16) + lab(216, 306, 'MDR3', { anchor: 'end' });

  // step 1 · uptake: 3 bile acids + 3 Na+ through NTCP
  for (let i = 0; i < 3; i++) {
    const a = 1.7 + i * .9, p1 = E(t, a, a + .7), p2 = E(t, a + .7, a + 1.1);
    const x0 = 40 + i * 26, y0 = 84;
    let x = L(x0, 110, p1), y = L(y0, 96, p1); x = L(x, 110 + (i - 1) * 9, p2); y = L(y, 126, p2);
    // step 2 · transit (bound to carrier protein) toward BSEP
    const p3 = E(t, 5.9 + i * .3, 8.6 + i * .3);
    const tx0 = 110 + (i - 1) * 9, ty0 = 126, tx1 = 104 + i * 12, ty1 = 294 - i * 3;
    if (p3 > 0) { x = L(tx0, tx1, p3) + 34 * Math.sin(Math.PI * p3); y = L(ty0, ty1, p3); }
    // step 3 · export through BSEP into the canaliculus
    const ae = 9.9 + i * 1.1, p4 = E(t, ae, ae + .45), p5 = E(t, ae + .45, ae + .9);
    if (p4 > 0) { x = L(tx1, 120, p4); y = L(ty1, 318, p4); }
    if (p5 > 0) { x = L(120, 128 + i * 22, p5); y = L(318, 346 + (i % 2) * 10, p5); }
    const vis = E(t, a - .3, a) * (1 - E(t, 17.4, 18.2));
    o += BA(x, y, vis);
    if (p3 > 0 && p4 < 1) o += G(vis * Math.min(1, p3 * 4) * (1 - p4), `<circle cx="${r2(x)}" cy="${r2(y)}" r="6.5" fill="none" stroke="${C.ink2}" stroke-width="1" stroke-dasharray="2 1.5"/>`);
    // Na+ enters and stays near the membrane
    o += NA(L(x0 + 10, 112, p1), L(y0 - 8, 98, p1) + 22 * p2, E(t, a - .3, a) * (1 - E(t, a + 1.2, a + 1.8)));
    o += flash(120, 318, lin(t, ae + .35, ae + .75));
  }
  o += G(E(t, 6.4, 6.9) * (1 - E(t, 9.0, 9.4)), tx(150, 266, 'carried by proteins', { size: 9.5, fill: C.ink2, italic: true }));
  o += G(E(t, 10.0, 10.4) * (1 - E(t, 14.4, 14.8)), tx(98, 310, 'ATP', { size: 9, anchor: 'end', weight: 700, fill: C.ink2, d: true }));
  // canalicular bile acids rise (gradient)
  for (let i = 0; i < 16; i++) {
    const x = 30 + ((hm(i, 0, 300) + (t - 10) * 6) % 310), y = hm(i + 40, 340, 368);
    o += BA(x, y, E(t, 10.2 + i * .2, 10.6 + i * .2) * (1 - E(t, 17.2 + i * .05, 18.0 + i * .05)));
  }
  o += G(E(t, 11.0, 11.6), `<polygon points="322,272 308,370 336,370" fill="${C.ba}" opacity=".3"/>` + tx(302, 288, '×1000', { size: 12, anchor: 'end', weight: 700, fill: C.bileT, d: true }) + tx(302, 300, 'uphill', { size: 9, anchor: 'end', fill: C.ink2, italic: true }));

  // step 4 · MDR3 flops phosphatidylcholine; mixed micelles form
  for (let i = 0; i < 3; i++) {
    const a = 15.0 + i * .7, p1 = E(t, a, a + .5), p2 = E(t, a + .5, a + 1.0), p3 = E(t, a + 1.0, a + 1.5);
    let x = 230, y = L(290, 316, p1), rot = 0;
    if (p2 > 0) rot = 180 * p2;
    if (p3 > 0) { x = L(230, 200 + i * 40, p3); y = L(316, 348, p3); }
    o += PC(x, y, E(t, a - .3, a) * (1 - E(t, 17.6, 18.2)), rot);
  }
  o += G(E(t, 15.2, 15.6) * (1 - E(t, 18.2, 18.6)), tx(248, 300, 'phospholipid (PC)', { size: 9.5, fill: C.pc, weight: 700 }));
  for (let i = 0; i < 2; i++) o += CHO(L(250, 222 + i * 52, E(t, 16.6, 17.4)), L(316, 352, E(t, 16.6, 17.4)), E(t, 16.4, 16.6) * (1 - E(t, 17.6, 18.2)));
  const mf = E(t, 17.6, 18.6), drift = Math.max(0, t - 18.6) * 22;
  [130, 180, 230, 280].forEach((x, i) => o += micelle(x + drift, 348 + (i % 2) * 6, mf, L(.4, 1, mf)));
  o += G(E(t, 18.4, 18.9), tx(180, 400, 'mixed micelle = bile acid + PC + cholesterol', { size: 9.5, anchor: 'middle', fill: C.ink2, italic: true }));

  return o + stepChip(t, [[1.4, 5.6, 1, 'Uptake · NTCP'], [5.6, 9.6, 2, 'Transit · FXR'], [9.6, 14.6, 3, 'Export · BSEP'], [14.6, 20.4, 4, 'Micelle · MDR3']]) +
    caption(t, [
      [0.4, 5.4, 'Bile is pumped uphill: blood →\nhepatocyte → canaliculus'],
      [9.7, 14.5, 'BSEP is the rate-limiting pump,\nabout 1000-fold uphill'],
      [14.8, 20.3, 'Phospholipid from MDR3 tames\nbile acids into micelles'],
    ]);
}

/* ============ Scene 2 · cholangiocyte: CFTR/AE2 and the bicarbonate umbrella (20.5–31.5) ============ */
function s2(t) {
  let o = '';
  o += `<rect x="-5" y="44" width="370" height="104" fill="${C.canal}"/>` + kick(16, 60, 'BILE DUCT LUMEN', C.bileT);
  for (let i = 0; i < 4; i++) o += micelle(((i * 97 + (t - 20.5) * 14) % 400) - 20, 78 + (i % 2) * 16, 1, .9);
  const filmOp = 1 - E(t, 27.2, 27.9);
  o += G(filmOp, `<rect x="-5" y="144" width="370" height="12" fill="${C.film}"/>` + tx(344, 138, 'HCO₃⁻ film · pH 7.4', { size: 9.5, anchor: 'end', weight: 700, fill: C.blue, d: true }));
  o += tx(344, 138, 'no buffer · pH 6.4', { size: 9.5, anchor: 'end', weight: 700, fill: C.bad, d: true, op: E(t, 27.6, 28.1) });
  // three cholangiocytes
  const inj = E(t, 29.0, 29.8);
  [[12, 124], [124, 236], [236, 348]].forEach(([a, b], i) => {
    const p = `M${a + 10},156 H${b - 10} Q${b},156 ${b},166 V308 Q${b},318 ${b - 10},318 H${a + 10} Q${a},318 ${a},308 V166 Q${a},156 ${a + 10},156Z`;
    o += `<path d="${p}" fill="${i === 1 ? mix(C.cholF, C.critT, inj) : C.cholF}"/>` + memb(p);
  });
  o += kick(24, 308, 'CHOLANGIOCYTES', C.chol);
  // CFTR: Cl- out
  o += tp(68, 156, 14, 22) + lab(68, 180, 'CFTR', { anchor: 'middle' });
  // AE2: HCO3- out, Cl- in
  o += tp(180, 156, 14, 22) + lab(180, 180, 'AE2', { anchor: 'middle' });
  const cyc = u => ((u % 1) + 1) % 1;
  if (t < 27.4) {
    for (let k = 0; k < 2; k++) {
      const u = cyc((t - 21.0) / 2.2 + k * .5), op = Math.sin(Math.PI * u) * E(t, 21.0, 21.4);
      o += tx(62, L(236, 108, u), 'Cl⁻', { size: 10, weight: 700, fill: C.ink2, op });
      o += tx(170, L(236, 108, u), 'HCO₃⁻', { size: 10, weight: 700, fill: C.blue, op, anchor: 'end' });
      o += tx(190, L(108, 236, u), 'Cl⁻', { size: 10, weight: 700, fill: C.ink2, op });
      o += tx(292, L(250, 108, u), 'H₂O', { size: 10, weight: 700, fill: C.blue, op: op * E(t, 22.0, 22.4), anchor: 'middle' });
    }
  }
  o += G(E(t, 22.0, 22.4) * (1 - E(t, 27.0, 27.4)), tx(292, 270, 'water follows', { size: 9.5, anchor: 'middle', fill: C.ink2, italic: true }));
  // secretin on the basolateral side
  o += G(E(t, 21.2, 21.7) * (1 - E(t, 27.8, 28.2)), tp(180, 318, 16, 12) + arrow(180, 344, 180, 328, C.blue, 1.6) + tx(180, 356, 'secretin', { size: 10, anchor: 'middle', fill: C.blue, weight: 700, d: true }));

  // pH demonstration: charged bile acid bounces off the film; protonated one slips in
  for (let i = 0; i < 3; i++) {
    const x = 110 + i * 34;
    const b = 25.9 + i * .25, pB = lin(t, b, b + 1.2);
    if (pB > 0 && pB < 1) { const y = 96 + 42 * Math.sin(Math.PI * pB); o += BA(x, y, Math.sin(Math.PI * Math.min(1, pB * 1.4)) + .2) + tx(x + 7, y + 3, '−', { size: 11, weight: 700, fill: C.baS }); }
    const c = 28.0 + i * .25, pC = E(t, c, c + 1.0);
    if (t >= c - .3 && t < 31.5) {
      const y = L(96, 214 + i * 10, pC), xx = L(x, 160 + i * 14, pC);
      o += BA(xx, y, E(t, c - .3, c)) + tx(xx + 6, y - 4, 'H', { size: 8, weight: 700, fill: C.bad, op: E(t, c - .3, c) });
    }
  }
  o += G(E(t, 26.0, 26.3) * (1 - E(t, 27.3, 27.6)), tx(220, 116, 'charged: bounces off', { size: 9.5, fill: C.ink2, italic: true }));
  o += G(E(t, 28.0, 28.3) * (1 - E(t, 31.0, 31.4)), tx(220, 116, 'protonated: slips in', { size: 9.5, fill: C.bad, italic: true, weight: 600 }));
  o += G(inj, cross(180, 262, 14, C.bad, 3) + tx(180, 288, 'apoptosis', { size: 10, anchor: 'middle', weight: 700, fill: C.bad, d: true }));
  // stat cards
  const sc = (x, stripe, k, m, sub, a) => G(E(t, a, a + .4), block(x, 336, 164, 72, stripe) + kick(x + 12, 358, k, stripe) +
    tx(x + 12, 386, m, { size: 22, weight: 700, fill: stripe === C.ok ? C.accent : C.bad }) + tx(x + 12, 400, sub, { size: 9.5, fill: C.ink2 }));
  o += sc(12, C.ok, 'PH 7.4 · BUFFERED', '×1', 'caspase activity', 28.6) + sc(184, C.bad, 'PH 6.4 · NO BUFFER', '×30', 'caspase activity (GCDC)', 29.2);

  return o + stepChip(t, [[20.8, 31.2, 5, 'Ducts · CFTR, AE2']]) + caption(t, [
    [20.8, 25.8, 'Cholangiocytes add water and\nbicarbonate: about ⅓ of bile'],
    [26.0, 31.3, 'Same bile acid: harmless at pH 7.4,\nlethal at pH 6.4'],
  ]);
}

/* ============ Scene 3 · enterohepatic circulation (31.5–42.5) ============ */
const LOOP = [[70, 92], [70, 262], [290, 262], [290, 92], [70, 92]];
function loopPos(s) {
  const segs = [170, 220, 170, 220], tot = 780; s = ((s % tot) + tot) % tot;
  for (let i = 0; i < 4; i++) { if (s <= segs[i]) { const p = s / segs[i]; return [L(LOOP[i][0], LOOP[i + 1][0], p), L(LOOP[i][1], LOOP[i + 1][1], p)]; } s -= segs[i]; }
  return LOOP[0];
}
function s3(t) {
  let o = '';
  const ap = E(t, 31.5, 32.2);
  let g = `<path d="M70,92 V262 H290" fill="none" stroke="${C.canal}" stroke-width="14" stroke-linejoin="round"/><path d="M70,92 V262 H290" fill="none" stroke="${C.ba}" stroke-width="1.6" stroke-linejoin="round" opacity=".7"/>`;
  g += `<path d="M290,262 V92 H70" fill="none" stroke="${C.veinL}" stroke-width="14" stroke-linejoin="round"/><path d="M290,262 V92 H70" fill="none" stroke="${C.vein}" stroke-width="1.6" stroke-linejoin="round" opacity=".7"/>`;
  g += tx(82, 182, 'bile duct', { size: 10, fill: C.bileT, italic: true });
  g += tx(180, 284, 'small intestine', { size: 10, anchor: 'middle', fill: C.bileT, italic: true });
  g += tx(278, 182, 'portal vein', { size: 10, anchor: 'end', fill: C.veinT, italic: true });
  o += G(ap, g);
  // particles
  const sp = 120;
  for (let i = 0; i < 16; i++) { const [x, y] = loopPos(i * 780 / 16 + sp * (t - 31.5)); o += BA(x, y, ap); }
  // liver node
  o += G(ap, `<ellipse cx="70" cy="92" rx="36" ry="24" fill="${C.hep}" stroke="${C.hepS}" stroke-width="1.5"/>` + kick(70, 95, 'LIVER', C.ink, { anchor: 'middle', size: 9.5 }));
  // ileum + ASBT
  o += G(ap, `<rect x="270" y="253" width="40" height="18" rx="9" fill="${C.accent}"/>` + tx(290, 265.5, 'ASBT', { size: 9, anchor: 'middle', weight: 700, fill: C.onSolid, d: true }) +
    tx(262, 246, 'ileum: 95% back', { size: 10, anchor: 'end', weight: 700, fill: C.accent, d: true }));
  // 5% leak and new synthesis
  const lk = ((t - 31.5) / 2.6) % 1;
  o += G(E(t, 37.2, 37.6), BA(290, L(272, 302, lk), Math.sin(Math.PI * lk)) + arrow(304, 276, 304, 300, C.ink2, 1.4) + tx(298, 312, '~5% → stool', { size: 9.5, anchor: 'end', fill: C.ink2 }));
  const sy = ((t - 31.5 + 1.3) / 2.6) % 1;
  o += G(E(t, 37.4, 37.8), BA(L(26, 44, sy), 92, Math.sin(Math.PI * sy)) + tx(30, 56, 'new synthesis (CYP7A1)', { size: 9.5, fill: C.ink2 }) + arrow(26, 62, 40, 72, C.ink2, 1.4));
  // FGF19 feedback
  o += G(E(t, 38.6, 39.2), `<line x1="272" y1="248" x2="100" y2="108" stroke="${C.nuc}" stroke-width="1.4" stroke-dasharray="4 3"/>` + arrow(118, 123, 100, 108, C.nuc, 1.4) +
    `<rect x="132" y="165" width="96" height="18" rx="9" fill="${C.bg}"/>` + tx(180, 178, 'FGF19 → ↓ CYP7A1', { size: 10, anchor: 'middle', weight: 700, fill: C.nuc, d: true }));
  // stat cards
  [['POOL', '2–4 g', 'bile acids in total', 32.4], ['CYCLES', '4–12×', 'per day, more with meals', 33.0], ['ILEUM', '95%', 'reabsorbed per cycle', 33.6]].forEach(([k, m, s, a], i) => {
    const x = 12 + i * 114;
    o += G(E(t, a, a + .4), block(x, 326, 108, 78, C.accent) + kick(x + 10, 348, k, C.blue) + tx(x + 10, 376, m, { size: 22, weight: 700, fill: C.accent }) + tx(x + 10, 392, s, { size: 8.5, fill: C.ink2 }));
  });
  o += tx(180, 414, 'Adult values; children have a smaller pool, same proportions.', { size: 8.5, anchor: 'middle', fill: C.ink2, italic: true, op: E(t, 34.0, 34.4) });
  return o + caption(t, [
    [31.8, 37.0, 'A small pool (2–4 g), recycled\n4–12 times a day'],
    [37.2, 42.3, '95% returns via the ileum;\nthe 5% lost is made anew'],
  ]);
}

/* ============ Scene 4 · the logic of GGT (42.5–55) ============ */
function gcard(t, y0, low) {
  const col = low ? C.bad : C.urg;
  let o = '';
  const a0 = low ? 42.6 : 42.9;
  let s = block(12, y0, 336, 186, col) + tx(28, y0 + 28, low ? 'Low GGT · export fails' : 'High GGT · micelle fails', { size: 14, weight: 700, fill: col, d: true }) +
    tx(28, y0 + 44, low ? I('ABCB11 · ATP8B1 · TJP2 · NR1H4 · MYO5B') : `${I('ABCB4')} (MDR3)`, { size: 10, fill: C.ink2 });
  // mini diagram
  s += `<rect x="24" y="${y0 + 54}" width="172" height="54" rx="8" fill="${C.hepF}" stroke="${C.mem}" stroke-width="1.2"/>` + tx(30, y0 + 66, 'hepatocyte', { size: 9, fill: C.ink2 });
  s += `<rect x="24" y="${y0 + 112}" width="172" height="34" fill="${C.canal}"/>` + `<rect x="24" y="${y0 + 148}" width="172" height="16" rx="4" fill="${C.cholF}"/>`;
  s += `<line x1="24" y1="${y0 + 147}" x2="196" y2="${y0 + 147}" stroke="${C.mem}" stroke-width="2.5"/>` + tx(30, y0 + 160, 'duct wall', { size: 8.5, fill: C.chol, weight: 600 });
  s += tp(70, y0 + 109, 22, 10) + tx(70, y0 + 103, 'BSEP', { size: 8, anchor: 'middle', weight: 700, fill: C.accent, d: true });
  s += tp(150, y0 + 109, 22, 10) + tx(150, y0 + 103, 'MDR3', { size: 8, anchor: 'middle', weight: 700, fill: C.accent, d: true });
  o += G(E(t, a0, a0 + .4), s);
  const brk = low ? E(t, 43.8, 44.3) : E(t, 44.0, 44.5);
  o += G(brk, cross(low ? 70 : 150, y0 + 109, 12, C.bad, 2.6));
  if (low) {
    for (let i = 0; i < 16; i++) o += BA(hm(i + 3, 34, 188), hm(i + 9, y0 + 72, y0 + 100), E(t, 43.8 + i * .12, 44.2 + i * .12), 3.2);
    o += G(E(t, 45.2, 45.6), tx(190, y0 + 66, 'trapped', { size: 9, anchor: 'end', fill: C.bad, weight: 700, italic: true }));
    [44, 76, 108, 140, 172].forEach(x => o += GGT(x, y0 + 146, E(t, a0, a0 + .4)));
  } else {
    for (let i = 0; i < 9; i++) o += BA(24 + ((i * 21 + (t - 43.6) * 26) % 172), y0 + 122 + (i % 3) * 7, E(t, 43.6, 44.0), 3.2);
    const wall = E(t, 46.4, 47.0);
    o += G(wall * .8, `<rect x="24" y="${y0 + 148}" width="172" height="16" rx="4" fill="${C.critT}"/>`);
    [44, 76, 108, 140, 172].forEach((x, i) => {
      const p = E(t, 45.4 + i * .25, 46.6 + i * .25);
      o += GGT(x + 14 * p, y0 + 146 - 40 * p, E(t, a0, a0 + .4) * (1 - .8 * p), 50 * p);
    });
    o += G(E(t, 46.4, 46.9), tx(110, y0 + 86, 'GGT stripped → blood', { size: 9.5, anchor: 'middle', fill: C.ggt, weight: 700, italic: true }));
  }
  // results
  const rows = low ? [['GGT', 'NORMAL', C.accent], ['Serum bile acids', 'VERY HIGH', C.bad], ['Itch', 'SEVERE', C.bad]]
    : [['GGT', 'HIGH', C.urg, C.onBright], ['Duct', 'INJURED', C.bad], ['UDCA (missense)', 'OFTEN HELPS', C.ok]];
  rows.forEach(([l, v, c, tc], i) => {
    const a = (low ? 46.0 : 47.6) + i * .35, y = y0 + 66 + i * 36;
    o += G(E(t, a, a + .35), tx(210, y, l, { size: 10, fill: C.ink2 }) + pillL(210, y + 17, v, c, tc));
  });
  return o;
}
function s4(t) {
  let o = gcard(t, 12, true) + gcard(t, 206, false);
  o += tx(180, 408, 'Newborns run a higher GGT: read “low” against the cholestasis.', { size: 9, anchor: 'middle', fill: C.ink2, italic: true, op: E(t, 49.5, 50.0) });
  return o + caption(t, [
    [43.0, 49.0, 'GGT reaches the blood only when\nbile acids strip it off membranes'],
    [49.2, 54.8, 'Low GGT + high bile acids + itch\n= export or membrane defect'],
  ]);
}

const SC = [{ a: 0, b: 20.5, draw: s1 }, { a: 20.5, b: 31.5, draw: s2 }, { a: 31.5, b: 42.5, draw: s3 }, { a: 42.5, b: 55, draw: s4 }];

function draw(t) {
  t = clamp(t, 0, T - 1e-6);
  const DEFS = `<defs>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
  const sc = SC.find(s => t >= s.a && t < s.b);
  document.getElementById('s').innerHTML = DEFS + `<rect width="360" height="480" fill="${C.bg}"/>` + G(env(t, sc.a, sc.b, .35), sc.draw(t));
}
function setTheme(name) { C = THEMES[name]; document.body.classList.toggle('dark', name === 'dark'); }
window.draw = draw; window.setTheme = setTheme;

const q = new URLSearchParams(location.search);
const isR = q.has('render');
setTheme(q.get('theme') === 'dark' ? 'dark' : 'light');
if (isR) document.body.classList.add('render');
const pp = document.getElementById('pp'), th = document.getElementById('th'), scb = document.getElementById('sc'), tm = document.getElementById('tm');
let playing = !isR, cur = 0, t0 = performance.now();
const show = v => { cur = v; draw(v); scb.value = v; tm.textContent = v.toFixed(1); };
function loop(now) { if (playing) show(((now - t0) / 1000) % T); requestAnimationFrame(loop); }
pp.onclick = () => { playing = !playing; if (playing) t0 = performance.now() - cur * 1000; pp.textContent = playing ? 'Pause' : 'Play'; };
th.onclick = () => { const dk = C === THEMES.light; setTheme(dk ? 'dark' : 'light'); th.textContent = dk ? 'Light' : 'Dark'; draw(cur); };
scb.oninput = () => { show(+scb.value); t0 = performance.now() - cur * 1000; };
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); pp.click(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { show(clamp(cur + (e.key === 'ArrowRight' ? 1 : -1), 0, T - .01)); t0 = performance.now() - cur * 1000; }
});
window.ready = document.fonts.ready;
window.ready.then(() => draw(cur));
draw(0);
if (!isR) requestAnimationFrame(loop);
</script>
</body>
